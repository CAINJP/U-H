<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Archivo Central</title>

<style>

body{
  margin:0;
  background: radial-gradient(circle at center, #1a0025 0%, #000 70%);
  color:#ff2b2b;
  font-family:Courier New, monospace;
}

/* LOGIN */

#login{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input{
  background:black;
  border:1px solid #ff2b2b;
  color:#ff2b2b;
  padding:10px;
  font-family:monospace;
}

button{
  margin-top:15px;
  background:#ff2b2b;
  color:black;
  border:none;
  padding:10px 30px;
  cursor:pointer;
}

/* TERMINAL */

#terminal{
  display:none;
  padding:25px;
}

#screen{
  height:90vh;
  overflow:auto;
}

#output{
  line-height:1.4;
  font-size:15px;
  text-shadow:0 0 5px #ff2b2b;
}

#command{
  background: transparent;
  border:none;
  outline:none;
  color:#ff2b2b;
  font-family:monospace;
  font-size:16px;
  width:70%;
  border-right:2px solid #ff2b2b;
}

@keyframes blink {
  50% { border-color: transparent; }
}

/* CRT SCANLINES */

#terminal::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,0,0,0.05),
    rgba(255,0,0,0.05) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events:none;
}

img{
  max-width:350px;
  display:block;
  margin:15px 0;
}
  
#screen{
  scrollbar-width: none; /* Firefox */
}

#screen::-webkit-scrollbar{
  display: none; /* Chrome, Safari, Edge */
}

</style>

</head>

<body>

<div id="login">
  <h1>AS ABOVE / SO BELOW</h1>
  <img 
  src="https://raw.githubusercontent.com/CAINJP/U-H/2cb939efa1436afb7d0ca15cd7a391f2a7a0b7c0/img/does-anyone-have-a-png-of-the-cain-logo-v0-wc7fz4j64y3h1.webp"
  style="width:120px; margin-bottom:20px; filter: drop-shadow(0 0 10px #ff0000);"
/>
  <p>Identificación de exorcista:</p>
  <input id="id">
  <button onclick="login()">ACCEDER</button>
  <p id="error"></p>
</div>

<div id="terminal">

  <div id="screen">

    <h2>ARCHIVO CENTRAL // ACCESO CONCEDIDO</h2>

    <div id="output">
      Acceso autorizado.<br><br>
      Sistema de archivos clasificados.<br><br>
      Escribe <b>help</b> para comandos.
    </div>

    <div>
      <span id="prompt"></span>
      <input id="command" autofocus>
    </div>

  </div>

</div>

<script>

let username = "";
let current = "/";

const users = ["X971","X481"];

/* 📁 ESTRUCTURA JERÁRQUICA */
const files = {
  "/": {
    type: "dir",
    content: {
      "Informes": {
        type: "dir",
        content: {
          "2024": {
            type: "dir",
            content: {
              "incidente01.txt": {
                type: "file",
                content: "INFORME 01\n\nActividad extraña detectada.\nLa investigación continúa."
              }
            }
          },
          "nota.txt": {
            type: "file",
            content: "No acceder después de medianoche."
          }
        }
      },

      "REDACTED": {
        type: "dir",
        content: {
          "archivo_clasificado.txt": {
            type: "file",
            content: "████ DOCUMENTO BORRADO ████"
          },

          "Fotografías": {
            type: "dir",
            content: {
              "foto1": {
                type: "image",
                content: "https://raw.githubusercontent.com/CAINJP/U-H/6178eb803df9219a1fff9f8a632f37e7c34f7602/img/imagen.gif"
              }
            }
          },

          "Audios": {
            type: "dir",
            content: {
              "audio1": {
                type: "audio",
                content: "https://raw.githubusercontent.com/CAINJP/U-H/b5f8681bb5fc004f255ed7f871de0d3d9928d30a/index.html"
              }
            }
          }
        }
      },

      "rumores": {
        type: "dir",
        content: {
          "rumor01.txt": {
            type: "file",
            content: "Movimientos dentro del lugar. No confirmado."
          }
        }
      },

      "personal": {
        type: "dir",
        content: {
          "foto1.html": {
            type: "file",
            content: "IMAGEN PERSONAL\n<img src='https://picsum.photos/400'>"
          }
        }
      }
    }
  }
};

/* LOGIN */

function login(){
  let id = document.getElementById("id").value.toUpperCase();

  if(users.includes(id)){
    username = id;
    document.getElementById("login").style.display="none";
    document.getElementById("terminal").style.display="block";
    document.getElementById("prompt").innerHTML = username+"@archivo:~$";
  } else {
    document.getElementById("error").innerHTML = "ID no autorizado";
  }
}

/* UTIL */

const command = document.getElementById("command");
const output = document.getElementById("output");

function print(text){
  output.innerHTML += "<br>"+text;

  let screen = document.getElementById("screen");

  // 🔽 baja automáticamente al final
  screen.scrollTop = screen.scrollHeight;
}

function getDir(path){
  let parts = path.split("/").filter(p => p);
  let node = files["/"];

  for(let p of parts){
    if(node.content && node.content[p]){
      node = node.content[p];
    } else {
      return null;
    }
  }
  return node;
}

/* COMANDOS */

command.addEventListener("keydown", function(e){

if(e.key === "Enter"){

  let text = command.value.trim();

  print(username + "@archivo:" + current + "$ " + text);

  let args = text.split(" ");

  /* HELP */
  if(text === "help"){
  print(`
📟 COMANDOS DISPONIBLES:
<br>
ls
→ Lista archivos y carpetas del directorio actual
<br>
cd <carpeta>
→ Entra en una carpeta (cd .. para volver atrás)
<br>
cat <archivo>
→ Muestra el contenido de un archivo
<br>
home
→ Vuelve al directorio principal
<br>
pwd
→ Muestra la ruta actual
<br>
clear
→ Limpia la pantalla del terminal
<br>
help
→ Muestra esta ayuda
`);
  }

  /* LS */
  else if(text === "ls"){
    let node = getDir(current);

    if(node && node.type === "dir"){
      for(let name in node.content){
        let item = node.content[name];
        print((item.type === "dir" ? "📁 " : "📄 ") + name);
      }
    }
  }

  /* CD */
  else if(args[0] === "cd"){
    let folder = args[1];

    if(folder === ".."){
      let parts = current.split("/").filter(p => p);
      parts.pop();
      current = "/" + parts.join("/");
      if(current === "/") current = "/";
      print("Retrocediendo a " + current);
    } else {
      let newPath = current === "/" ? "/" + folder : current + "/" + folder;
      let node = getDir(newPath);

      if(node && node.type === "dir"){
        current = newPath;
        print("Accediendo a " + current);
      } else {
        print("No existe esa carpeta");
      }
    }
  }

  /* CAT */
  else if(args[0] === "cat"){
  let file = args[1];
  let node = getDir(current);

  if(node && node.content && node.content[file]){
    let item = node.content[file];

    /* 📄 TEXTO */
    if(item.type === "file"){
      print(item.content);
    }

    /* 🖼️ IMAGEN */
    else if(item.type === "image"){
      print("Mostrando imagen...");

      let img = document.createElement("img");
      img.src = item.content;
      img.style.maxWidth = "350px";
      img.style.display = "block";
      img.style.margin = "10px 0";

      output.appendChild(img);
    }

    /* 🎧 AUDIO */
    else if(item.type === "audio"){
      print("Reproduciendo audio...");

      let audio = new Audio(item.content);
      audio.play();
    }

  } else {
    print("Archivo no encontrado");
  }
}

  /* HOME */
  else if(text === "home"){
    current = "/";
    print("Directorio principal");
  }

  /* PWD */
  else if(text === "pwd"){
    print(current);
  }

  /* CLEAR */
  else if(text === "clear"){
    output.innerHTML = "";
  }

  else {
    print("Comando desconocido");
  }

  command.value = "";
  document.getElementById("prompt").innerHTML =
    username + "@archivo:" + current + "$";
}

});

</script>

</body>
</html>
