<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Archivo Central</title>

<style>
body{
  margin:0;
  background: radial-gradient(circle at center, #1a0025 0%, #000 70%);
  color:#ff2b2b;
  font-family:Courier New, monospace;
}

#login{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

input{
  background:black;
  border:1px solid #ff2b2b;
  color:#ff2b2b;
  padding:10px;
  font-family:monospace;
}

button{
  margin-top:15px;
  background:#ff2b2b;
  color:black;
  border:none;
  padding:10px 30px;
  cursor:pointer;
}

#terminal{
  display:none;
  padding:25px;
}

#screen{
  height:90vh;
  overflow:auto;
}

#output{
  line-height:1.4;
  font-size:15px;
  text-shadow:0 0 5px #ff2b2b;
}

#command{
  background: transparent;
  border:none;
  outline:none;
  color:#ff2b2b;
  font-family:monospace;
  font-size:16px;
  width:70%;
  border-right:2px solid #ff2b2b;
}

#terminal::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,0,0,0.05),
    rgba(255,0,0,0.05) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events:none;
}

img{
  max-width:350px;
  display:block;
  margin:15px 0;
}

#screen::-webkit-scrollbar{
  display:none;
}
</style>
</head>

<body>

<div id="login">
  <h1>AS ABOVE / SO BELOW</h1>
  <input id="id">
  <button onclick="login()">ACCEDER</button>
  <p id="error"></p>
</div>

<div id="terminal">
  <div id="screen">
    <h2>ARCHIVO CENTRAL</h2>

    <div id="output"></div>

    <div>
      <span id="prompt"></span>
      <input id="command">
    </div>
  </div>
</div>

<script>

let username = "";
let current = "/";
let currentAudio = null;

const users = ["X971","X481"];

/* 📁 SISTEMA DE ARCHIVOS */
const files = {
  "/": {
    type: "dir",
    content: {
      "doc": {
        type: "dir",
        content: {}
      }
    }
  }
};

/* 🔥 CARGA DESDE GITHUB */
async function loaddocFromGitHub(){

  const url = "https://raw.githubusercontent.com/CAINJP/U-H/main/doc/a.json";

  try{
    let res = await fetch(url);
    let data = await res.json();

    let node = getDir("/doc");
    node.content = data;

    print("📡 Informes cargados desde GitHub");

  } catch(e){
    print("❌ Error cargando Informes");
  }
}

/* LOGIN */
function login(){

  let id = document.getElementById("id").value.toUpperCase();

  if(users.includes(id)){

    username = id;

    document.getElementById("login").style.display="none";
    document.getElementById("terminal").style.display="block";

    document.getElementById("prompt").innerHTML =
      username+"@archivo:~$";

    loaddocFromGitHub(); // 🔥 IMPORTANTE

  } else {
    document.getElementById("error").innerHTML = "ID no autorizado";
  }
}

/* UTIL */
const command = document.getElementById("command");
const output = document.getElementById("output");

function print(text){
  output.innerHTML += "<br>" + text;
  document.getElementById("screen").scrollTop =
    document.getElementById("screen").scrollHeight;
}

function getDir(path){
  let parts = path.split("/").filter(p => p);
  let node = files["/"];

  for(let p of parts){
    if(node.content && node.content[p]){
      node = node.content[p];
    } else {
      return null;
    }
  }
  return node;
}

/* COMANDOS */
command.addEventListener("keydown", function(e){

if(e.key !== "Enter") return;

let text = command.value.trim();
print(username + "@archivo:" + current + "$ " + text);

let args = text.split(" ");

/* LS */
if(text === "ls"){

  let node = getDir(current);

  for(let name in node.content){
    let item = node.content[name];
    print((item.type === "dir" ? "📁 " : "📄 ") + name);
  }
}

/* CD */
else if(args[0] === "cd"){

  let folder = args[1];

  if(folder === ".."){
    let parts = current.split("/").filter(p => p);
    parts.pop();
    current = "/" + parts.join("/");
    if(current === "") current = "/";
  } else {
    let newPath = current === "/" ? "/" + folder : current + "/" + folder;
    if(getDir(newPath)){
      current = newPath;
    } else {
      print("No existe");
    }
  }
}

/* CAT */
else if(args[0] === "cat"){

  let file = args[1];
  let node = getDir(current);

  if(node && node.content[file]){

    let item = node.content[file];

    if(item.type === "file"){
      print(item.content);
    }

  } else {
    print("Archivo no encontrado");
  }
}

else if(text === "pwd"){
  print(current);
}

else if(text === "clear"){
  output.innerHTML = "";
}

else {
  print("Comando desconocido");
}

command.value = "";
});

</script>

</body>
</html>
