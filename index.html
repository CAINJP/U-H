<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Archivo Central</title>

<style>

body{
    margin:0;
    background:#000;
    color:#00ff66;
    font-family:Courier New, monospace;
}


#login{

height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

}


input{

background:black;
border:1px solid #00ff66;
color:#00ff66;
padding:10px;
font-family:monospace;

}


button{

margin-top:15px;
background:#00ff66;
border:none;
padding:10px 30px;
cursor:pointer;

}


#terminal{

display:none;
padding:25px;

}


#screen{

height:90vh;
overflow:auto;

}


#command{

background:black;
border:none;
outline:none;
color:#00ff66;
font-family:monospace;
font-size:16px;
width:70%;

}


img{

max-width:350px;
display:block;
margin:15px 0;

}


</style>

</head>



<body>




<div id="login">


<h1>
SYSTEM ACCESS
</h1>


<p>
Identificación:
</p>


<input id="id">


<button onclick="login()">
ACCEDER
</button>


<p id="error"></p>


</div>







<div id="terminal">


<div id="screen">


<h2>
ARCHIVO CENTRAL // CONEXIÓN ESTABLECIDA
</h2>



<div id="output">


Acceso autorizado.<br><br>


Sistema de archivos clasificados.<br><br>


Escribe <b>help</b> para comandos.


</div>



<div>

<span id="prompt"></span>

<input id="command" autofocus>

</div>



</div>

</div>









<script>


let username="";

let current="/";




const users=[

"X971",
"X481"

];





const files={





"/Informes":{


"incidente01.txt":`

INFORME 01

Fecha: 13/05

Actividad extraña detectada.

La investigación continúa.

`,



"nota.txt":`

NOTA:

No acceder al edificio después
de medianoche.

`

},







"/REDACTED":{


"archivo_clasificado.txt":`

████████████

DOCUMENTO BORRADO

Nivel de acceso:
RESTRINGIDO

████████████

`

},







"/rumores":{


"rumor01.txt":`

RUMOR:

Algunos testigos hablan de
movimientos dentro del lugar.

No confirmado.

`

},








"/personal":{


"foto1.html":`

IMAGEN PERSONAL

<img src="https://picsum.photos/400">

`,


"foto2.html":`

ARCHIVO VISUAL

<img src="https://picsum.photos/401">

`

}



};









function login(){


let id =
document.getElementById("id").value
.toUpperCase();




if(users.includes(id)){


username=id;



document.getElementById("login").style.display="none";


document.getElementById("terminal").style.display="block";



document.getElementById("prompt").innerHTML =
username+"@archivo:~$";


}


else{


document.getElementById("error").innerHTML =
"ID no autorizado";


}



}










const command =
document.getElementById("command");


const output =
document.getElementById("output");







function print(text){


output.innerHTML +=
"<br>"+text;


}









command.addEventListener("keydown",function(e){



if(e.key==="Enter"){



let text =
command.value.trim();



print(
username+
"@archivo:"+
current+
"$ "+
text
);




let args =
text.split(" ");








if(text==="help"){


print(`

Comandos:

ls<br>
cd carpeta<br>
cat archivo<br>
home<br>
clear

`);

}




else if(text==="ls"){



if(current==="/"){


print("📁 Informes");
print("📁 REDACTED");
print("📁 rumores");
print("📁 personal");


}

else{


for(let f in files[current]){


print("📄 "+f);


}



}



}









else if(args[0]==="cd"){



let folder=args[1];



if(
folder==="Informes" ||
folder==="REDACTED" ||
folder==="rumores" ||
folder==="personal"
){


current="/"+folder;


print(
"Accediendo a "+current
);


}

else{


print(
"No existe esa carpeta"
);


}


}









else if(args[0]==="cat"){



let file=args[1];



if(files[current] &&
files[current][file]){


print(
files[current][file]
);



}

else{


print(
"Archivo no encontrado"
);


}


}










else if(text==="home"){


current="/";


print(
"Directorio principal"
);


}








else if(text==="clear"){


output.innerHTML="";


}








else{


print(
"Comando desconocido"
);


}







command.value="";



document.getElementById("prompt").innerHTML =
username+
"@archivo:"+
current+
"$";



}



});




</script>



</body>
</html>
